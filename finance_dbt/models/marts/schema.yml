version: 2

models:
  - name: mart_daily_stock_performance
    description: >
      business-facing mart: one row per sumbol per trading day.
      Contains rolling SMAs, rolling volatility, cumulative return, and daily return.
      Incremental model - new dates are appended only.
    columns:
      - name: symbol_date
        description: "Surrogate key: symbol + '_' + date (e.g. AAPL_2026-03-07)"
        tests:
          - not_null
          - unique
      - name: symbol
        description: "Ticker symbol"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_company_metadata')
                field: symbol
      - name: date
        description: "Trading date"
        tests:
          - not_null
      - name: company_name
        description: "Company name"
        tests:
          - not_null
      - name: sector
        description: "Sector"
        tests:
          - not_null
      - name: close_price
        description: "Closing price for the trading day/period"
        tests:
          - not_null
      - name: daily_return
        description: "Simple return for the day. NULL on the first trading day per symbol."
      - name: sma_5
        description: "5-day simple moving average of close_price"
      - name: sma_20
        description: "20-day simple moving average of close_price"
      - name: volatility_21
        description: "21-day rolling volatility (stddev) of daily_return"
      - name: cumulative_return
        description: "Cumulative return since first available trading day: (close_price / first_close) - 1"

  - name: mart_sector_volume_summary
    description: >
      Sector-fevel daily aggregation: total volume and average daily return per sector per date.
    columns:
      - name: sector
        description: "GICS sector"
        tests:
          - not_null
      - name: date 
        description: "Trading date"
        tests:
          - not_null
      - name: total_volume
        description: "Sum of trading volume across all symbols in the sector"
        tests:
          - not_null
      - name: avg_daily_return
        description: "Average of daily returns across all symbols in the sector"

  - name: mart_fundamental_metrics
    description: >
      Fundamental metrics for each symbol, updated in quarterly basis.
    columns:
      - name: symbol
        description: "Ticker symbol"
        tests:
          - not_null
      - name: period_end_date
        description: "End date of the financial period"
        tests:
          - not_null
      - name: form_type
        description: "Type of SEC filing (e.g. 10-K, 10-Q)"
      - name: revenue
        description: "Total revenue for the period"
      - name: net_income
        description: "Net income for the period"
      - name: eps_diluted
        description: "Earnings per share (diluted) for the period"
      - name: long_term_debt
        description: "Long-term debt at the end of the period"
      - name: total_assets
        description: "Total assets at the end of the period"
      - name: company_name
        description: "Company legal entity name"
      - name: sector
        description: "GICS sector"
      - name: revenue_yoy_growth
        description: "Year-over-year revenue growth"
      - name: debt_to_assets
        description: "Debt-to-assets ratio"

  - name: mart_macro_stock_correlation
    description: >
      Macroeconomic metrics for each period
    columns:
      - name: symbol
        description: "Ticker symbol"
        tests:
          - not_null
      - name: date
        description: "date of the stock price"
        tests:
          - not_null
      - name: sector
        description: "Financial sector of that stock"
        tests:
          - not_null
      - name: daily_return
        description: "Daily arithmetic return of the close price compared to previous trading day"
        tests:
          - not_null
      - name: close_price
        description: "Close price of the stock on specified date on 'date'"
        tests:
          - not_null
      - name: fed_funds_rate
        description: "Federal Reserve Bank funds rate"
      - name: cpi
        description: "Consumer Price Indexes"
      - name: yield_curve_spread
        description: "Difference between 10Y and 2Y government bond yield"
      - name: unemployment_rate
        description: "Unemployment rate"